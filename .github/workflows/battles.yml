name: Resolve battles

# Armies that arrive while nobody has the game open are fought here, so
# players get their battle results and bot notifications within minutes.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  # Vercel reports each deploy to GitHub; a finished production deploy runs
  # this right away, so the bot drafts the update announcement in seconds
  # (GitHub's schedule above often runs hours late).
  deployment_status:

jobs:
  resolve:
    if: >-
      github.event_name != 'deployment_status' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Call the battle resolver
        env:
          # Optional repository secrets; the defaults work for the live game.
          APP_URL: ${{ secrets.APP_URL || 'https://valorians-legend.vercel.app' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -fsS --max-time 60 ${CRON_SECRET:+-H "Authorization: Bearer $CRON_SECRET"} "$APP_URL/api/cron/battles"
